{% assign media_items = site.data.media[page.media_key] %}
<div class="media-gallery">
  {% for item in media_items %}
    <figure class="media-gallery__item">
      <div class="media-gallery__media">
        {% if item.type == "video" %}
          <video controls preload="metadata" aria-label="{{ item.title }}">
            <source src="{{ item.source | relative_url }}">
          </video>
        {% else %}
          <img src="{{ item.source | relative_url }}" alt="{{ item.title }}" loading="lazy">
        {% endif %}
      </div>
      <figcaption>
        {{ item.title }}
        {% if item.note %}<span class="media-gallery__note">{{ item.note }}</span>{% endif %}
      </figcaption>
    </figure>
  {% endfor %}
</div>

{% if page.back_url %}
  <p class="media-page__back"><a href="{{ page.back_url | relative_url }}"><span aria-hidden="true">&larr;</span> {{ page.back_label }}</a></p>
{% endif %}
